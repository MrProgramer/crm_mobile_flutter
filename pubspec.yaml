name: crm_mobile
description: "سامانه هوشمند انبارداری، حسابداری و فاکتورسازی بازرگانی - نسخه اختصاصی موبایل و اندروید"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Localization & Persian Calendar
  intl: ^0.19.0
  shamsi_date: ^1.0.1

  # Typography & Design
  google_fonts: ^6.2.1

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.13.1

  # Share & File Operations
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  file_picker: ^8.0.0

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
